<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude株ナビ</title>
<meta name="theme-color" content="#1B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="株ナビ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A; --ink-soft:#3B4866; --paper:#EEF1F4; --sheet:#FFFFFF; --rule:#DCE1E9;
  --muted:#6B7385; --gold:#A8802A; --gold-soft:#F3EBD6; --up:#1E8A5A; --down:#C23B4B;
  --up-bg:#E2F2E9; --down-bg:#FAE5E8; --cert:#FBFAF6; --tab:#FFFFFFF0;
  --c-div:#A8802A; --c-earn:#3559A8; --c-dt:#1C8580;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --shadow:0 1px 0 var(--rule), 0 10px 24px -18px #1B2A4A66;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#E6EAF2; --ink-soft:#C3CAD8; --paper:#0E1630; --sheet:#16213D; --rule:#26324F;
    --muted:#8E98AF; --gold:#D2AE5E; --gold-soft:#2E2919; --up:#4CC48C; --down:#F06A7B;
    --up-bg:#143326; --down-bg:#3A1C25; --cert:#17223F; --tab:#111A33F0;
    --c-div:#D2AE5E; --c-earn:#7E9EE8; --c-dt:#4FC2BB;
    --shadow:0 1px 0 var(--rule), 0 10px 24px -18px #00000099;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.7;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{padding:calc(14px + env(safe-area-inset-top)) 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--mincho);font-weight:800;font-size:21px;letter-spacing:.04em}
.status{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
.status b{display:block;color:var(--gold);font-weight:700}
h2{font-family:var(--mincho);font-weight:800;font-size:20px;margin:30px 0 10px;letter-spacing:.02em;line-height:1.4}
h2 small{font-family:var(--gothic);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.lead{color:var(--muted);font-size:14px;margin:-4px 0 12px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.num{font-feature-settings:"tnum" 1}

/* 株券（いちばん大事な数字） */
.cert{position:relative;margin:10px 0 0;background:var(--cert);border-radius:8px;padding:22px 20px 16px;box-shadow:var(--shadow);overflow:hidden}
.cert svg.guil{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cert .inner{position:relative}
.cert .kind{font-size:13px;color:var(--ink-soft)}
.cert .gain{font-family:var(--mincho);font-weight:800;font-size:46px;line-height:1.1;margin:8px 0 2px;letter-spacing:.01em}
.cert .gain .unit{font-size:22px;margin-left:2px}
.cert .sub{font-size:14px;color:var(--ink-soft)}
.cert .sub b{font-weight:700}
.seal{position:absolute;right:16px;top:16px;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);
  color:var(--gold);display:grid;place-items:center;font-family:var(--mincho);font-weight:800;font-size:12px;line-height:1.2;text-align:center;
  transform:rotate(-8deg);opacity:.9}
.chart{margin-top:12px;height:78px}
.chart svg{width:100%;height:100%;display:block}
.cert .note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

/* 今日のひとこと */
.say{margin:14px 0 0;padding:14px 16px;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);font-size:15px;line-height:1.75}
.say b{font-weight:700}

/* 3つの数字（1枚の紙を区切る） */
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 0;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow)}
.trio button{border:none;background:none;padding:12px 6px 10px;cursor:pointer;text-align:center;position:relative}
.trio button + button::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--rule)}
.trio .n{font-family:var(--mincho);font-weight:800;font-size:26px;line-height:1.2;display:block}
.trio .n small{font-size:13px;margin-left:1px}
.trio .l{font-size:12px;color:var(--muted);display:block}
.trio .x{font-size:11px;display:block;margin-top:2px}

/* ルールの順位 */
.ranks{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow)}
.ranks li + li{border-top:1px solid var(--rule)}
.ranks button{width:100%;border:none;background:none;text-align:left;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:14px 14px 12px}
.ranks .pos{font-family:var(--mincho);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.ranks li:first-child .pos{color:var(--gold)}
.ranks .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.ranks .st{grid-column:2;font-size:12px;color:var(--muted);line-height:1.5}
.ranks .pct{grid-row:1 / span 2;grid-column:3;text-align:right;font-weight:700;font-size:17px;line-height:1.3}
.ranks .pct small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.spark{grid-column:2 / span 2;height:22px;margin-top:2px}
.spark svg{width:100%;height:100%;display:block}

/* ルールの色の印 */
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--rc)}
.dot.gap{background:transparent;border:2.5px solid var(--rc)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px 2px 7px;border-radius:999px;background:color-mix(in srgb, var(--rc) 12%, transparent);color:var(--ink-soft);white-space:nowrap}
.chip .dot{width:8px;height:8px}
.chip .dot.gap{border-width:2px}

/* 切り替え */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--rule);border-radius:10px;padding:3px;margin:8px 0 14px;position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:5}
.seg button{border:none;background:none;border-radius:8px;padding:7px 4px;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 3px #0002}
.seg button small{font-size:12px;margin-left:3px;color:var(--muted);font-weight:400}

/* 銘柄の行 */
.stocks{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow)}
.stocks li{padding:14px 14px 12px}
.stocks li + li{border-top:1px solid var(--rule)}
.srow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.srow .nm{font-weight:700;font-size:16px;line-height:1.4}
.srow .cd{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.srow .why{font-size:13px;color:var(--ink-soft);margin-top:3px;line-height:1.55}
.srow .when{font-size:12px;color:var(--muted);margin-top:2px}
.badge{flex:none;min-width:72px;text-align:center;border-radius:6px;padding:4px 8px;font-weight:700;font-size:16px;line-height:1.3}
.badge.up{background:var(--up-bg)} .badge.down{background:var(--down-bg)} .badge.flat{background:var(--paper)}
.badge small{display:block;font-weight:400;font-size:11px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daygrp{font-size:13px;color:var(--muted);margin:16px 2px 6px;display:flex;justify-content:space-between}
.daygrp b{color:var(--ink);font-weight:700}

.empty{padding:22px 16px;color:var(--muted);font-size:14px;background:var(--sheet);border-radius:8px}
.callout{margin:16px 0 0;padding:12px 14px;border-left:3px solid var(--gold);background:var(--sheet);font-size:14px;border-radius:0 6px 6px 0}

/* 用語 */
.term{border:none;background:none;padding:0;cursor:help;text-decoration:underline dotted var(--gold);text-underline-offset:4px;text-decoration-thickness:1.5px}
.sheet-bg{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet-bg.open{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(16px);transition:transform .2s ease}
.sheet-bg.open .sheet{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px}
.sheet h3{font-family:var(--mincho);font-weight:800;font-size:21px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.sheet p{margin:0 0 12px;font-size:15px}
.sheet .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.sheet .kv div{background:var(--paper);border-radius:8px;padding:10px 12px}
.sheet .kv span{display:block;font-size:12px;color:var(--muted)}
.sheet .kv b{font-family:var(--mincho);font-weight:800;font-size:22px}
.sheet button.close{width:100%;border:1px solid var(--rule);background:transparent;border-radius:10px;padding:10px 16px;cursor:pointer;margin-top:4px}

/* 検証 */
.test{background:var(--sheet);border-radius:8px;box-shadow:var(--shadow);padding:16px 16px 14px;margin-bottom:12px}
.test h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.vs div{border-radius:6px;padding:8px 10px;background:var(--paper)}
.vs div:first-child{background:color-mix(in srgb, var(--rc) 12%, var(--sheet))}
.vs span{display:block;font-size:12px;color:var(--muted)}
.vs b{font-family:var(--mincho);font-weight:800;font-size:22px;line-height:1.3}
.vs b small{font-size:13px}
.test .dd{font-size:12px;color:var(--muted)}
.years{display:grid;grid-template-columns:52px 1fr 50px;gap:5px 10px;align-items:center;font-size:12px;margin-top:10px}
.years .y{color:var(--muted);white-space:nowrap}
.years .track{position:relative;height:12px}
.years .track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule)}
.years .track i{position:absolute;top:0;height:8px;border-radius:2px}
.years .track i.rand{top:9px;height:3px;background:var(--muted);opacity:.5}
.years .v{text-align:right;font-weight:700}
.legend{font-size:12px;color:var(--muted);margin:8px 0 0}
.legend b{display:inline-block;width:14px;height:4px;vertical-align:middle;margin:0 4px 0 10px;border-radius:2px}
details.glossary{margin-top:18px;background:var(--sheet);border-radius:8px;padding:4px 16px 12px}
details.glossary summary{cursor:pointer;font-weight:700;padding:10px 0}
details.glossary dt{font-weight:700;margin-top:10px}
details.glossary dd{margin:0;color:var(--ink-soft);font-size:14px}

/* ニュース */
.news{list-style:none;margin:0;padding:0;background:var(--sheet);border-radius:8px;box-shadow:var(--shadow)}
.news li{padding:14px 16px}
.news li + li{border-top:1px solid var(--rule)}
.news h4{margin:0;font-size:15px;line-height:1.55}
.news p{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.news .src{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
.news .chips .chip{background:var(--paper)}
.more{display:block;width:100%;margin:10px 0 0;border:1px solid var(--rule);background:transparent;border-radius:10px;padding:10px;cursor:pointer;font-size:14px}

/* タブ */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--tab);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:none;background:none;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar button[aria-current="page"] svg{stroke-width:2.2}
.pill,.trio button:focus-visible,.ranks button:focus-visible,.seg button:focus-visible,.tabbar button:focus-visible,.term:focus-visible,.more:focus-visible{outline-offset:2px}
:focus-visible{outline:2px solid var(--gold)}

section[hidden]{display:none}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Claude株ナビ</div>
    <div class="status" id="status"></div>
  </header>

  <!-- ホーム -->
  <section id="tab-home">
    <div class="cert">
      <svg class="guil" aria-hidden="true" id="guil"></svg>
      <div class="seal" aria-hidden="true">仮想<br>売買</div>
      <div class="inner">
        <div class="kind" id="cert-kind">5つのルールの合計</div>
        <div class="gain num" id="cert-gain">—</div>
        <div class="sub num" id="cert-sub"></div>
        <div class="chart" id="cert-chart"></div>
        <div class="note">架空の100万円ずつを、5つのルールどおりに売買した結果です。本物のお金は動いていません。</div>
      </div>
    </div>

    <div class="say" id="say"></div>

    <div class="trio" id="trio"></div>

    <h2>ルールの順位<small>タップで説明</small></h2>
    <ul class="ranks" id="ranks"></ul>

    <h2>今週のニュース</h2>
    <div id="news-teaser"></div>
  </section>

  <!-- 銘柄 -->
  <section id="tab-stocks" hidden>
    <h2 id="stocks-title">銘柄</h2>
    <div class="seg" id="seg" role="group" aria-label="表示を切り替える"></div>
    <p class="lead" id="stocks-lead"></p>
    <div id="stocks"></div>
  </section>

  <!-- 検証 -->
  <section id="tab-test" hidden>
    <h2>過去5年で試したら</h2>
    <p class="lead">2021〜2026年の本物の株価で、同じルールを試した結果（<button class="term" data-term="バックテスト">バックテスト</button>）です。これから同じように増える保証はありません。</p>
    <div id="tests"></div>
    <details class="glossary">
      <summary>用語のかんたん解説</summary>
      <dl id="glossary"></dl>
    </details>
  </section>

  <!-- ニュース -->
  <section id="tab-news" hidden>
    <h2>今週のニュース</h2>
    <p class="lead">毎週日曜の夜に、株価に関係しそうなニュースを集めています。売買のルールにはまだ使っていない参考情報です。</p>
    <div id="news"></div>
  </section>
</div>

<div class="sheet-bg" id="sheet-bg" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="grip" aria-hidden="true"></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
    <button class="close" id="sheet-close">閉じる</button>
  </div>
</div>

<nav class="tabbar" aria-label="画面の切り替え">
  <div class="in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>ホーム</button>
    <button data-tab="stocks"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>銘柄</button>
    <button data-tab="test"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>過去の検証</button>
    <button data-tab="news"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>ニュース</button>
  </div>
</nav>

<script>
const RAW = 'https://raw.githubusercontent.com/takaperon/claude-kabu-navi/reports/';
const START = 1000000;

// ルール：色（増配＝金、上方修正＝藍、デイトレ＝青緑）と、白抜きの印＝「朝高い時だけ」
const STRATS = {
  swing_div:      { name: '増配で買う',        fam: 'div',  gap: false, desc: '「配当を増やします」と発表した会社を、次の朝の寄り付きで買い、5日後の引けで売ります。', test: 'ev_div_up|hold5' },
  swing_div_gap:  { name: '増配＋朝高い時だけ',  fam: 'div',  gap: true,  desc: '増配の会社のうち、次の朝に前の日より高く始まった時だけ買います。5日後に売ります。', test: 'ev_div_up_gap|hold5' },
  swing_earn:     { name: '上方修正で買う',      fam: 'earn', gap: false, desc: '「今年の利益は予想より多くなりそう」と発表し、株価も上向きの会社を次の朝に買って、5日後に売ります。', test: 'ev_earn_up_trend|hold5' },
  swing_earn_gap: { name: '上方修正＋朝高い時だけ', fam: 'earn', gap: true,  desc: '上方修正の会社のうち、次の朝に前の日より高く始まった時だけ買います。5日後に売ります。', test: 'ev_earn_up_trend_gap|hold5' },
  dt_div:         { name: '増配デイトレ',        fam: 'dt',   gap: false, desc: '増配の会社を次の朝の寄り付きで買い、その日の引け（15時半）に売ります。夜をまたいで持ちません。', test: 'dt' },
};
const ORDER = ['swing_div', 'swing_div_gap', 'swing_earn', 'swing_earn_gap', 'dt_div'];
const RC = { div: 'var(--c-div)', earn: 'var(--c-earn)', dt: 'var(--c-dt)' };

const TERMS = {
  '配当': '会社が稼いだ利益の一部を、株主に現金で配るお金です。株を持っているだけで受け取れます。',
  '増配': '配当を前の予定より増やすこと。会社が「この先も稼げる」と自信を見せた合図として、株価が上がりやすいと言われます。',
  '上方修正': '会社が「今年の利益は、前に出した予想より多くなりそう」と発表すること。',
  '寄り付き': '朝9時に、その日はじめてつく値段のこと。株ナビはこの値段で買います。',
  '引け': '取引の最後（15時半）につく値段のこと。株ナビはこの値段で売ります。',
  'デイトレ': '買ったその日のうちに売る取引。夜や週末をまたがないので、その間の急な値動きの影響を受けません。',
  '仮想売買': '本物のお金を使わず、ルールどおりに売買したことにして成績を記録すること。本番の前の練習です。',
  '含み益': 'まだ売っていない株の、今の値段で計算した儲け（マイナスなら含み損）。売るまでは確定しません。',
  '勝率': '売った回数のうち、利益が出た回数の割合。',
  'バックテスト': '過去の本物の株価で、そのルールを使っていたらどうなっていたかを計算すること。',
  '最大の減り': '途中でいちばん資金が減ったときの下げ幅。大きいほど、途中でつらい時期があったという意味です。',
  '朝高': '次の朝の寄り付きが、前の日の終わりの値段より高く始まること。市場がその発表を好感したサインと見ています。',
};

let paper = null, backtest = null, newsData = null, seg = 'hold';

const $ = (id) => document.getElementById(id);
const yen = (v) => Math.round(v).toLocaleString('ja-JP');
const man = (v) => { const a = Math.abs(v); return a >= 10000 ? (Math.round(a / 1000) / 10).toLocaleString('ja-JP') + '万' : yen(a); };
const code4 = (c) => (c && c.length === 5 && c.endsWith('0')) ? c.slice(0, 4) : c;
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const sign = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d);
const md = (iso) => { if (!iso) return ''; const [, m, d] = iso.slice(0, 10).split('-'); return `${+m}/${+d}`; };
const wd = (iso) => '日月火水木金土'[new Date(iso.slice(0, 10) + 'T00:00:00+09:00').getDay()];
const nf = (s) => String(s ?? '').normalize('NFKC');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const term = (t, label) => `<button class="term" data-term="${t}">${label ?? t}</button>`;
const dot = (k) => `<i class="dot${STRATS[k].gap ? ' gap' : ''}" style="--rc:${RC[STRATS[k].fam]}" aria-hidden="true"></i>`;
const chip = (k) => `<span class="chip" style="--rc:${RC[STRATS[k].fam]}">${dot(k)}${STRATS[k].name}</span>`;

async function getJSON(path) {
  const r = await fetch(RAW + path + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return r.json();
}

// ---------- 株券の地紋 ----------
function drawGuilloche() {
  const svg = $('guil');
  const w = 400, h = 300;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none');
  const gold = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim();
  let paths = '';
  for (let k = 0; k < 3; k++) {
    let d = '';
    const inset = 7 + k * 3.2, steps = 240, W = w - 2 * inset, H = h - 2 * inset, per = 2 * W + 2 * H;
    for (let s = 0; s <= steps; s++) {
      const t = s / steps; let p = t * per, x, y;
      if (p < W) { x = inset + p; y = inset; }
      else if ((p -= W) < H) { x = w - inset; y = inset + p; }
      else if ((p -= H) < W) { x = w - inset - p; y = h - inset; }
      else { p -= W; x = inset; y = h - inset - p; }
      const a = Math.sin(t * Math.PI * 2 * 50 + k * 1.3) * 1.6;
      const dx = w / 2 - x, dy = h / 2 - y, len = Math.hypot(dx, dy) || 1;
      d += (s ? 'L' : 'M') + (x + dx / len * a).toFixed(1) + ' ' + (y + dy / len * a).toFixed(1);
    }
    paths += `<path d="${d}Z" fill="none" stroke="${gold}" stroke-width="0.55" opacity="${0.75 - k * 0.15}"/>`;
  }
  const rx = w - 66, ry = 60;
  for (let k = 0; k < 9; k++) {
    let d = '';
    for (let s = 0; s <= 240; s++) {
      const t = s / 240 * Math.PI * 2, r = 30 + 9 * Math.sin(7 * t + k * 0.7);
      d += (s ? 'L' : 'M') + (rx + r * Math.cos(t)).toFixed(1) + ' ' + (ry + r * Math.sin(t)).toFixed(1);
    }
    paths += `<path d="${d}Z" fill="none" stroke="${gold}" stroke-width="0.45" opacity="0.12"/>`;
  }
  svg.innerHTML = paths;
}

// ---------- グラフ ----------
function line(vals, base, w, h, opts = {}) {
  if (!vals || vals.length < 2) {
    return `<svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" stroke="var(--rule)" stroke-dasharray="3 4"/>
      ${opts.empty ? `<text x="${w / 2}" y="${h - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${opts.empty}</text>` : ''}</svg>`;
  }
  const lo = Math.min(...vals, base), hi = Math.max(...vals, base), pad = (hi - lo) * 0.15 || base * 0.01;
  const y = (v) => h - 3 - ((v - (lo - pad)) / ((hi + pad) - (lo - pad))) * (h - 6);
  const x = (i) => (i / (vals.length - 1)) * w;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const col = opts.color ?? (vals.at(-1) >= base ? 'var(--up)' : 'var(--down)');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${opts.label ?? '推移'}">
    <line x1="0" y1="${y(base)}" x2="${w}" y2="${y(base)}" stroke="var(--rule)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
    ${opts.fill ? `<polygon points="0,${h} ${pts} ${w},${h}" fill="${col}" opacity="0.09"/>` : ''}
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${opts.stroke ?? 2}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals.at(-1))}" r="${opts.r ?? 3}" fill="${col}"/>
  </svg>`;
}

// 5つのルールを合計した資産の推移（日付ごとに足す。記録のない日は直前の値）
function combined() {
  const dates = [...new Set(ORDER.flatMap((k) => paper.strategies[k].equityHistory.map((e) => e.date)))].sort();
  const last = Object.fromEntries(ORDER.map((k) => [k, START]));
  const maps = Object.fromEntries(ORDER.map((k) => [k, new Map(paper.strategies[k].equityHistory.map((e) => [e.date, e.value]))]));
  return dates.map((d) => { let s = 0; for (const k of ORDER) { if (maps[k].has(d)) last[k] = maps[k].get(d); s += last[k]; } return { date: d, value: s }; });
}
const tradingDays = () => combined().length - 1;

// ---------- 銘柄の集計（同じ銘柄が複数ルールにあれば1行にまとめる） ----------
function gather(kind) {
  const map = new Map();
  for (const k of ORDER) {
    const st = paper.strategies[k];
    const list = kind === 'next' ? st.nextBuys : kind === 'hold' ? st.holdings : st.recentClosed;
    for (const x of list) {
      const key = kind === 'sold' ? `${x.code}|${x.entryDate}|${x.exitDate}` : kind === 'hold' ? `${x.code}|${x.entryDate}` : x.code;
      if (!map.has(key)) map.set(key, { ...x, ks: [], hold: st.hold });
      const m = map.get(key);
      m.ks.push(k);
      m.hold = Math.min(m.hold, st.hold);
    }
  }
  return [...map.values()];
}

// ---------- 検証 ----------
function testFor(k) {
  if (!backtest) return null;
  const key = STRATS[k].test;
  if (key === 'dt') {
    const d = backtest.daytrade?.['div_up|nostop|all'];
    if (!d) return null;
    const yearly = {};
    for (const p of [d.portfolioTrain, d.portfolioTest]) for (const [y, v] of Object.entries(p.yearly || {})) yearly[y] = ((1 + (yearly[y] ?? 0) / 100) * (1 + v / 100) - 1) * 100;
    const total = ((1 + d.portfolioTrain.returnPct / 100) * (1 + d.portfolioTest.returnPct / 100) - 1) * 100;
    return { total, dd: Math.max(d.portfolioTrain.maxDDPct, d.portfolioTest.maxDDPct), yearly };
  }
  const r = backtest.robustness?.[key];
  if (!r) return null;
  return { total: r.fullPeriod.returnPct, dd: r.fullPeriod.maxDDPct, yearly: r.fullPeriod.yearly };
}
function renderTests() {
  if (!backtest) { $('tests').innerHTML = '<p class="empty">検証結果を読み込めませんでした。電波のよい場所で開き直してください。</p>'; return; }
  const rand = backtest.randomYearly || {};
  const randTotal = (Object.values(rand).reduce((a, r) => a * (1 + (r.avg ?? 0) / 100), 1) - 1) * 100;
  const rows = ORDER.map((k) => ({ k, t: testFor(k) })).filter((x) => x.t).sort((a, b) => b.t.total - a.t.total);
  $('tests').innerHTML = rows.map(({ k, t }) => {
    const years = Object.entries(t.yearly).filter(([y]) => y !== '2021');
    const scale = Math.max(20, ...years.map(([, v]) => Math.abs(v)), ...years.map(([y]) => Math.abs(rand[y]?.avg ?? 0)));
    return `<div class="test" style="--rc:${RC[STRATS[k].fam]}">
      <h3>${dot(k)}${STRATS[k].name}</h3>
      <div class="vs">
        <div><span>100万円がこうなった</span><b class="num">${man(START * (1 + t.total / 100))}<small>円</small></b></div>
        <div><span>適当に選んで買ったら</span><b class="num">${man(START * (1 + randTotal / 100))}<small>円</small></b></div>
      </div>
      <div class="dd">途中の${term('最大の減り')}：${t.dd}%</div>
      <div class="years">${years.map(([y, v]) => {
        const w = Math.abs(v) / scale * 50, rv = rand[y]?.avg, rw = rv != null ? Math.abs(rv) / scale * 50 : 0;
        return `<span class="y">${y}年</span><span class="track">
          <i style="${v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`};background:${v >= 0 ? 'var(--up)' : 'var(--down)'}"></i>
          ${rv != null ? `<i class="rand" style="${rv >= 0 ? `left:50%;width:${rw}%` : `right:50%;width:${rw}%`}"></i>` : ''}
        </span><span class="v num ${cls(v)}">${sign(v, 0)}%</span>`;
      }).join('')}</div></div>`;
  }).join('') + `<p class="legend"><b style="background:var(--up)"></b>このルール<b style="background:var(--muted);opacity:.5"></b>適当に選んで買った場合の平均</p>
    <div class="callout">5年のうち前半3年で見つけたルールが、後半2年でも通用するかを確かめてから選んでいます。それでも過去にうまくいったことが、これからも続くとは限りません。だから今は${term('仮想売買')}で様子を見ています。</div>`;
  $('glossary').innerHTML = Object.entries(TERMS).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

// ---------- 操作 ----------
function openSheet(title, html) {
  $('sheet-title').innerHTML = title;
  $('sheet-body').innerHTML = html;
  $('sheet-bg').classList.add('open');
  $('sheet-close').focus();
}
function closeSheet() { $('sheet-bg').classList.remove('open'); }
function go(tab) {
  for (const s of document.querySelectorAll('section')) s.hidden = s.id !== 'tab-' + tab;
  for (const b of document.querySelectorAll('.tabbar button')) {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
  window.scrollTo(0, 0);
  try { localStorage.setItem('tab', tab); } catch {}
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('.term'); if (t) { e.stopPropagation(); openSheet(esc(t.dataset.term), `<p>${TERMS[t.dataset.term] ?? ''}</p>`); return; }
  const r = e.target.closest('[data-rule]'); if (r) { openRule(r.dataset.rule); return; }
  const s = e.target.closest('[data-seg]'); if (s) { seg = s.dataset.seg; try { localStorage.setItem('seg', seg); } catch {} renderStocks(); go('stocks'); return; }
  const b = e.target.closest('.tabbar button'); if (b) { go(b.dataset.tab); return; }
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (e.target.id === 'sheet-bg' || e.target.id === 'sheet-close') closeSheet();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

async function main() {
  drawGuilloche();
  try { seg = localStorage.getItem('seg') || seg; } catch {}
  if (!['next', 'hold', 'sold'].includes(seg)) seg = 'hold';
  try {
    paper = await getJSON('reports/paper.json');
  } catch (err) {
    $('tab-home').innerHTML = `<p class="empty" style="margin-top:20px">データを読み込めませんでした。電波のよい場所で、もう一度開いてください。</p>`;
    return;
  }
  const [bt, idx] = await Promise.allSettled([getJSON('reports/backtest.json'), getJSON('news/index.json')]);
  backtest = bt.status === 'fulfilled' ? bt.value : null;
  if (idx.status === 'fulfilled' && idx.value.latest) {
    try { newsData = await getJSON(`news/${idx.value.latest}.json`); } catch {}
  }
  const u = new Date(paper.updatedAt);
  $('status').innerHTML = `<b>仮想売買 ${tradingDays()}日目</b>${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2, '0')}:${String(u.getMinutes()).padStart(2, '0')} 更新`;
  renderHome(); renderStocks(); renderTests(); renderNews();
  try { const t = localStorage.getItem('tab'); if (t && $('tab-' + t)) go(t); } catch {}
}
main();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
