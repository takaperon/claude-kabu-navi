name: update
# 株価の取得 → バックテスト → 集計結果を reports ブランチへ
# 株価データ本体は暗号化して Actions キャッシュにだけ置く（リポジトリには置かない）
on:
  push:
    branches: [main]
    paths: ['scripts/*.mjs', 'scripts/lib/**', '.github/workflows/update.yml']
  schedule:
    - cron: '10 10 * * 1-5' # 平日 19:10 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      JQUANTS_RPM: '60'   # ライトプラン
      JQUANTS_YEARS: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data.tar.enc
          key: prices-v1-${{ github.run_id }}
          restore-keys: prices-v1-

      - name: decrypt data
        run: |
          if [ -f data.tar.enc ] && [ -n "$JQUANTS_API_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:JQUANTS_API_KEY -in data.tar.enc | tar xzf - && echo "restored $(ls data/prices | wc -l) days"
          else
            echo "no cache"
          fi

      - name: fetch prices
        run: node scripts/fetch.mjs --data data --out reports-out --max-minutes 300

      - name: paper trading
        run: node scripts/paper.mjs --data data --out reports-out

      - name: news evaluation
        run: |
          git fetch -q --depth=1 origin reports && mkdir -p news-in && git archive FETCH_HEAD news | tar xf - -C news-in || echo "no news"; git archive FETCH_HEAD events | tar xf - -C news-in 2>/dev/null || echo "no events"
          git archive FETCH_HEAD movers 2>/dev/null | tar xf - -C news-in 2>/dev/null || echo "no movers"
          node scripts/news-eval.mjs --data data --news news-in/news --out reports-out
          node scripts/movers-eval.mjs --data data --movers news-in/movers --out reports-out || echo "movers-eval failed"

      - name: pro (プロの判断の検証。仮想売買が使う特徴の選び方も data/paper に保存)
        continue-on-error: true
        run: node scripts/pro.mjs --data data --out reports-out

      - name: precursor (上がる前の気配の検証)
        continue-on-error: true
        run: node scripts/precursor.mjs --data data --out reports-out

      - name: calendar (決まった時期の動きの検証)
        continue-on-error: true
        run: node scripts/calendar.mjs --data data --out reports-out

      - name: earnpre (決算発表の前の動き)
        continue-on-error: true
        run: node scripts/earnpre.mjs --data data --out reports-out

      - name: macro-jp (日銀の会合・FOMCの次の日)
        continue-on-error: true
        run: node scripts/macro-jp.mjs --data data --out reports-out

      - name: theme (テーマ株：出来事・火がついた日の後の動き)
        continue-on-error: true
        run: node scripts/theme.mjs --data data --out reports-out --triggers news-in/events/theme-triggers.json

      - name: movers (本日の値上がりランキング)
        continue-on-error: true
        run: node scripts/movers.mjs --data data --out reports-out

      - name: encrypt data
        if: always()
        run: |
          if [ -d data/prices ] && [ -n "$JQUANTS_API_KEY" ]; then
            tar czf - data | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:JQUANTS_API_KEY -out data.tar.enc
          fi

      - name: save data cache
        if: always() && hashFiles('data.tar.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: data.tar.enc
          key: prices-v1-${{ github.run_id }}

      - name: backtest
        run: node scripts/backtest.mjs --data data --out reports-out


      - name: publish reports
        if: always()
        run: |
          git fetch origin reports:reports 2>/dev/null && git worktree add rep reports || git worktree add --orphan -b reports rep
          mkdir -p rep/reports
          cp reports-out/*.json rep/reports/ 2>/dev/null || true
          cd rep
          git config user.name "kabunavi-bot"
          git config user.email "kabunavi-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "reports $(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)" || exit 0
          for i in 1 2 3; do git push -q origin reports && break; git pull -q --rebase origin reports; sleep 5; done
