name: us-backtest
# 米国株の検証だけをやり直す（データ取得の実行を待たない。キャッシュは読むだけ）
on:
  push:
    branches: [main]
    paths: ['scripts/us/backtest.mjs', '.github/workflows/us-backtest.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data-us.tar.enc
          key: us-v1-${{ github.run_id }}
          restore-keys: us-v1-
      - name: decrypt data
        run: |
          if [ -f data-us.tar.enc ] && [ -n "$TIINGO_API_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TIINGO_API_KEY -in data-us.tar.enc | tar xzf - && echo "restored $(ls data-us/prices | wc -l) tickers"
          else
            echo "no cache"
          fi
      - name: backtest
        run: node scripts/us/backtest.mjs --data data-us --out reports-out
      - name: publish reports
        if: always()
        run: |
          git fetch origin reports:reports 2>/dev/null && git worktree add rep reports || git worktree add --orphan -b reports rep
          mkdir -p rep/reports
          cp reports-out/us-backtest.json rep/reports/ 2>/dev/null || true
          cd rep
          git config user.name "kabunavi-bot"
          git config user.email "kabunavi-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "us reports $(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)" || exit 0
          for i in 1 2 3; do git push -q origin reports && break; git pull -q --rebase origin reports; sleep 5; done
