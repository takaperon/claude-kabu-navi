name: us-intraday
# 米国株の場中（5分足）の検証（2026-11-18〜）。Tiingo の無料枠（1時間50回）に合わせて毎時少しずつ集め、集まった分で売り方を比べる
on:
  workflow_dispatch:
  schedule:
    - cron: '35 0-21,23 * * *' # 毎時（us.yml が Tiingo を使う 22時UTC台は避ける）
  push:
    branches: [main]
    paths: ['scripts/us/intraday*', '.github/workflows/us-intraday.yml']
permissions:
  contents: write
concurrency:
  group: us-intraday
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: intraday.tar.enc
          key: us-intraday-${{ github.run_id }}
          restore-keys: us-intraday-
      - name: decrypt
        run: |
          if [ -f intraday.tar.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TIINGO_API_KEY -in intraday.tar.enc | tar xzf - && echo "restored $(ls data-us-intraday | wc -l)"; else mkdir -p data-us-intraday; echo "no cache"; fi
      - name: events list
        run: git fetch -q origin reports && git show FETCH_HEAD:reports/us-events.json > us-events.json
      - name: collect
        # GitHub の定期実行は毎時にならず5〜7時間おきなので（2026-11-19 確認）、1回の実行の中で1時間ずつ待って最大5回集める（Tiingo の1時間50回を守る）。
        # 22時UTC台は us.yml が Tiingo を使うので待つ。全部そろうか、上限以外の理由で止まったら終わり
        run: |
          for round in 1 2 3 4 5; do
            while [ "$(date -u +%H)" = "22" ]; do sleep 300; done
            bash scripts/quiet.sh python scripts/us/intraday_collect.py
            python3 -c "import json,sys; s=json.load(open('collect-status.json')); sys.exit(0 if s.get('stoppedBy')=='max' and not s.get('errors') else 1)" || break
            [ "$round" = 5 ] || sleep 3660
          done
      - name: eval
        run: bash scripts/quiet.sh python scripts/us/intraday_eval.py
      - name: encrypt and save
        if: always()
        run: tar czf - data-us-intraday | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TIINGO_API_KEY -out intraday.tar.enc
      - name: save cache
        if: always() && hashFiles('intraday.tar.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: intraday.tar.enc
          key: us-intraday-${{ github.run_id }}
      - name: publish
        if: always()
        run: |
          mkdir -p reports-out && cp collect-status.json reports-out/us-intraday-collect.json 2>/dev/null || true
          git fetch origin reports:reports && git worktree add rep reports
          mkdir -p rep/reports && cp reports-out/us-intraday*.json rep/reports/ 2>/dev/null || exit 0
          cd rep && git config user.name "kabunavi-bot" && git config user.email "kabunavi-bot@users.noreply.github.com"
          git add -A && git commit -q -m "us intraday $(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)" || exit 0
          for i in 1 2 3; do git push -q origin reports && break; git pull -q --rebase origin reports; sleep 5; done
